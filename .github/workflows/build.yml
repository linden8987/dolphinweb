name: Build and Deploy Web Dolphin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51 

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libglib2.0-dev

      - name: Configure CMake
        run: |
          mkdir build
          emcmake cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=OFF \
            -DENABLE_SDL=ON \
            -DUSE_X11=OFF \
            -DENABLE_LTO=ON \
            -DWEBSPACE_OPTIMIZATIONS=ON \
            -DENABLE_GENERIC=ON

      - name: Compile Dolphin WASM
        run: |
          ninja -C build

      - name: Prepare Flat Deployment
        run: |
          # Create a temporary staging folder for the website
          mkdir -p staging
          
          # 1. Copy the compiled WASM and JS from the build folder
          cp build/bin/dolphin-emu.wasm staging/
          cp build/bin/dolphin-emu.js staging/
          
          # 2. Copy your index.html and manifest.json from the REPO ROOT
          # This assumes you have manually placed them there as requested
          cp index.html staging/
          cp manifest.json staging/
          
          # 3. Copy the icon from the REPO ROOT
          if [ -f "icon.png" ]; then 
            cp icon.png staging/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This uploads the files directly, unzipped, for GitHub Pages to host
          path: 'staging'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
